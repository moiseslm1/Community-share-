<form method="POST">
  {% csrf_token %}

  <label class="form-label">ID Number</label>
  <input type="number" name="id_number" class="form-control mb-3" placeholder="Enter ID">

  <label class="form-label">Username</label>
  <input type="text" name="username" class="form-control mb-3" placeholder="Username">

  <label class="form-label">First Name</label>
  <input type="text" name="first_name" class="form-control mb-3" placeholder="First Name">

  <label class="form-label">Last Name</label>
  <input type="text" name="last_name" class="form-control mb-3" placeholder="Last Name">

  <label class="form-label">Email</label>
  <input type="email" name="email" class="form-control mb-3" placeholder="Email">

  <label class="form-label">Date of Birth</label>
  <input type="date" name="dob" class="form-control mb-3">

  <label class="form-label">Address</label>
  <input type="text" name="address" class="form-control mb-3" placeholder="Address">

  <label class="form-label">City</label>
  <input type="text" name="city" class="form-control mb-3" placeholder="City">

  <label class="form-label">Zipcode</label>
  <input type="number" name="zipcode" class="form-control mb-3" placeholder="Zipcode">

  <label class="form-label">Biography</label>
  <textarea name="biography" class="form-control mb-3" placeholder="Tell us about yourself"></textarea>

  <button type="submit" class="btn btn-primary w-100">Save Account</button>
</form>
