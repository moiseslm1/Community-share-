<form method="POST">
  {% csrf_token %}

  <input type="number" name="job_id" class="form-control mb-3" placeholder="Job ID">
  <input type="text" name="title" class="form-control mb-3" placeholder="Job Title">
  <input type="text" name="username" class="form-control mb-3" placeholder="Username">
  <input type="date" name="review_date" class="form-control mb-3">
  <input type="number" step="0.1" min="0" max="5" name="rating_num" class="form-control mb-3" placeholder="Rating 0-5">
  <textarea name="description" class="form-control mb-3" placeholder="Review Description"></textarea>

  <button type="submit" class="btn btn-primary w-100">Submit Rating</button>
</form>
